<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Заметки блогера</title>
<meta name="description" content="Голосовые заметки для блогера: сказал мысль, телефон сам превратил её в текст и разложил по рубрикам.">
<meta name="theme-color" content="#17142A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Заметки">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript>Для работы нужен JavaScript.</noscript>
<script type="module">
  const ok = 'indexedDB' in window && typeof WebAssembly === 'object' && 'Worker' in window;
  if (!ok) document.getElementById('app').innerHTML = '<p style="padding:24px">Этот браузер слишком старый. Обнови iOS до 16.4 или новее и открой страницу в Safari.</p>';
  else import('./js/app.js').then(m => m.start()).catch(e => {
    document.getElementById('app').innerHTML = '<p style="padding:24px">Не получилось запустить: ' + e.message + '. Обнови iOS до 16.4 или новее.</p>';
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(r => {
      const notify = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) dispatchEvent(new Event('sw-update')); });
      if (r.waiting && navigator.serviceWorker.controller) dispatchEvent(new Event('sw-update'));
      r.addEventListener('updatefound', () => notify(r.installing));
      setInterval(() => r.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
    // перезагрузка только при обновлении версии, а не при первой установке
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  }
</script>
</body>
</html>
